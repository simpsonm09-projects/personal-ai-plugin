name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-projects/repo-standard/.github/workflows/lint.yml@34941736aa4de7d634376043ae80527c3bfc76ea # repo-standard main
  aislop:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/aislop.yml@34941736aa4de7d634376043ae80527c3bfc76ea # repo-standard main
  security:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/security.yml@34941736aa4de7d634376043ae80527c3bfc76ea # repo-standard main
  standard:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/standard.yml@34941736aa4de7d634376043ae80527c3bfc76ea # repo-standard main
  coverage:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/coverage.yml@34941736aa4de7d634376043ae80527c3bfc76ea # repo-standard main

  test:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Install and test
        run: |
          npm ci
          npm test
